<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tasq</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="matter.min.js"></script>
</head>

<body>
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-title">tasq</div>
      <div class="sidebar-menu">
        <div class="menu-item active" data-filter="all">すべて</div>
        <div class="menu-item" data-filter="month" id="menu-month">月ごと</div>
        <div class="month-select-wrap" id="month-select-wrap" style="display:none;">
          <select id="month-select">
          </select>
        </div>
        <div class="menu-item" data-filter="overdue">期限切れ</div>
        <div class="menu-item" data-filter="done">完了済み</div>
      </div>

      <div class="sidebar-legend">
        <div class="legend-item">
          <div class="dot green"></div>余裕あり（7日以上）
        </div>
        <div class="legend-item">
          <div class="dot yellow"></div>注意（3〜6日）
        </div>
        <div class="legend-item">
          <div class="dot red"></div>緊急（1〜2日）
        </div>
        <div class="legend-item">
          <div class="dot purple"></div>期限切れ
        </div>
        <div class="legend-item">
          <div class="dot gray"></div>期限なし
        </div>
      </div>
      <div class="sidebar-stats">
        <div class="stat">合計 <b id="s-total">0</b></div>
        <div class="stat">完了 <b id="s-done">0</b></div>
        <div class="stat">期限切れ <b id="s-over">0</b></div>
      </div>
    </div>

    <div class="main">
      <div class="add-form">
        <input type="text" id="inp-name" placeholder="タスク名" />
        <input type="date" id="inp-deadline" />
        <input type="time" id="inp-time" />
        <input type="color" id="inp-color" value="#a78bfa" title="タスクの色" />
        <button id="btn-add">追加</button>
      </div>

      <div class="canvas-wrap">
        <canvas id="physics-canvas"></canvas>
        <div id="task-labels"></div>
      </div>
      <div id="list-view" style="display:none;">
        <div id="list-wrap"></div>
      </div>
    </div>
  </div>
  <script src="main.js"></script>
</body>

</html>
